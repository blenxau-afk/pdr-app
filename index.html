<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <!-- viewport: щоб на iPhone не було зуму і все було під ширину екрана -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Тест ПДР</title>
  <!-- Офіційна бібліотека Telegram Mini Apps: дає доступ до теми, кнопок, вібрації -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Кольори беруться з теми Telegram користувача (світла/темна).
       Після коми — запасний колір, якщо відкрити не в Telegram */
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #888888);
      --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --ok: #2e9e5b;
      --bad: #d64545;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .top { display: flex; justify-content: space-between; color: var(--hint); font-size: 14px; margin-bottom: 8px; }
    .bar { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
    .bar div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    .question { font-size: 18px; font-weight: 600; line-height: 1.35; margin-bottom: 16px; }
    .option {
      display: block; width: 100%; text-align: left; font-size: 16px;
      padding: 14px; margin-bottom: 10px; border: 2px solid transparent;
      border-radius: 12px; background: var(--card); color: var(--text); cursor: pointer;
    }
    .option.correct { border-color: var(--ok); background: rgba(46,158,91,.12); }
    .option.wrong { border-color: var(--bad); background: rgba(214,69,69,.12); }
    .option:disabled { cursor: default; }
    .explain { display: none; padding: 12px; border-radius: 12px; background: var(--card); color: var(--text); font-size: 15px; line-height: 1.4; margin-top: 6px; }
    .result { text-align: center; padding-top: 40px; }
    .result h1 { font-size: 48px; margin: 0 0 8px; }
    .btn { width: 100%; padding: 14px; font-size: 16px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text); margin-top: 20px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ===== 1. ПІДКЛЮЧЕННЯ ДО TELEGRAM =====
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();   // кажемо Telegram, що апка завантажилась
      tg.expand();  // розгортаємо на весь екран
    }

    // ===== 2. ПИТАННЯ (поки 3 тестових; потім винесемо в окремий questions.json) =====
    // correct — номер правильної відповіді, рахуємо з 0
    const QUESTIONS = [
      {
        text: "Яка максимальна дозволена швидкість легкового автомобіля в населеному пункті (якщо знаками не встановлено інше)?",
        options: ["40 км/год", "50 км/год", "60 км/год", "70 км/год"],
        correct: 1,
        explain: "У населених пунктах дозволено рухатися зі швидкістю не більше 50 км/год, якщо знаки не встановлюють інше обмеження."
      },
      {
        text: "Який вміст алкоголю в крові вважається станом алкогольного сп'яніння для водія?",
        options: ["0,2 проміле і більше", "0,5 проміле і більше", "0,8 проміле і більше", "Будь-який"],
        correct: 0,
        explain: "В Україні водій вважається п'яним, якщо вміст алкоголю в крові становить 0,2 проміле і більше."
      },
      {
        text: "Що означає жовтий миготливий сигнал світлофора?",
        options: [
          "Рух заборонено",
          "Рух дозволено, перехрестя нерегульоване, треба бути обережним",
          "Скоро ввімкнеться зелений",
          "Дозволено рух тільки праворуч"
        ],
        correct: 1,
        explain: "Жовтий миготливий означає, що рух дозволено, але світлофор не регулює перехрестя. Воно нерегульоване, і діяти треба за знаками пріоритету."
      }
    ];

    // ===== 3. СТАН ТЕСТУ =====
    let index = 0;   // номер поточного питання
    let score = 0;   // кількість правильних

    const app = document.getElementById("app");

    // ===== 4. ПОКАЗАТИ ПИТАННЯ =====
    function showQuestion() {
      const q = QUESTIONS[index];
      const progress = (index / QUESTIONS.length) * 100;

      app.innerHTML = `
        <div class="top"><span>Питання ${index + 1} з ${QUESTIONS.length}</span><span>✅ ${score}</span></div>
        <div class="bar"><div style="width:${progress}%"></div></div>
        <div class="question">${q.text}</div>
        ${q.options.map((opt, i) => `<button class="option" data-i="${i}">${opt}</button>`).join("")}
        <div class="explain" id="explain">💡 ${q.explain}</div>
      `;

      // вішаємо клік на кожен варіант
      app.querySelectorAll(".option").forEach(btn => {
        btn.addEventListener("click", () => answer(Number(btn.dataset.i)));
      });

      tg?.MainButton.hide();
    }

    // ===== 5. ОБРОБКА ВІДПОВІДІ =====
    function answer(chosen) {
      const q = QUESTIONS[index];
      const buttons = app.querySelectorAll(".option");

      buttons.forEach(b => b.disabled = true);       // блокуємо повторне натискання
      buttons[q.correct].classList.add("correct");   // підсвічуємо правильну

      if (chosen === q.correct) {
        score++;
        tg?.HapticFeedback.notificationOccurred("success"); // легка вібрація
      } else {
        buttons[chosen].classList.add("wrong");
        tg?.HapticFeedback.notificationOccurred("error");
      }

      document.getElementById("explain").style.display = "block";

      // Кнопка "Далі": у Telegram — нативна знизу, у браузері — звичайна
      const isLast = index === QUESTIONS.length - 1;
      const label = isLast ? "Результат" : "Далі";
      if (tg?.MainButton) {
        tg.MainButton.setText(label);
        tg.MainButton.show();
      } else {
        app.insertAdjacentHTML("beforeend", `<button class="btn" onclick="next()">${label}</button>`);
      }
    }

    // ===== 6. НАСТУПНЕ ПИТАННЯ АБО РЕЗУЛЬТАТ =====
    function next() {
      index++;
      if (index < QUESTIONS.length) showQuestion();
      else showResult();
    }
    tg?.MainButton.onClick(next); // нативна кнопка Telegram викликає next()

    // ===== 7. ЕКРАН РЕЗУЛЬТАТУ =====
    function showResult() {
      tg?.MainButton.hide();
      const mistakes = QUESTIONS.length - score;
      // Правило ГСЦ: максимум 2 помилки
      const passed = mistakes <= 2;
      app.innerHTML = `
        <div class="result">
          <h1>${passed ? "🎉" : "😬"}</h1>
          <div class="question">${passed ? "Склав!" : "Не склав"}</div>
          <div style="color:var(--hint)">Правильно: ${score} з ${QUESTIONS.length} · Помилок: ${mistakes}</div>
          <button class="btn" onclick="restart()">Пройти ще раз</button>
        </div>
      `;
    }

    function restart() { index = 0; score = 0; showQuestion(); }

    showQuestion(); // старт
  </script>
</body>
</html>
